<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atari 2600 VCS Simulator</title>
<style>
  :root {
    --wood: #6b3e26;
    --wood-dark: #422414;
    --gold: #f59e0b;
    --orange: #ea580c;
    --bg: #111113;
    --panel: #1c1917;
    --red: #dc2626;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: #f5f5f4;
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden;
  }
  .app {
    max-width: 520px;
    margin: 0 auto;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 100dvh;
  }
  /* TOP BAR */
  .topbar {
    background: var(--panel);
    border: 2px solid var(--wood);
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 1px;
  }
  .badge {
    font-size: 10px;
    background: #292524;
    color: var(--gold);
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid var(--gold);
  }
  .top-actions {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .btn {
    background: #292524;
    color: #fafaf9;
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .btn:active, .btn.active {
    background: var(--gold);
    color: #000;
  }
  /* GAME SELECTOR PILLS */
  .cart-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: var(--panel);
    padding: 5px;
    border-radius: 8px;
    border: 1px solid #44403c;
  }
  .cart-btn {
    background: #292524;
    color: #d6d3d1;
    border: 1px solid #57534e;
    border-radius: 6px;
    padding: 6px 2px;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: 0.1s;
    line-height: 1.15;
  }
  .cart-btn.active {
    background: var(--orange);
    color: #fff;
    border-color: #fde047;
    box-shadow: 0 0 8px rgba(234, 88, 12, 0.6);
  }
  /* CRT TV SCREEN */
  .tv-frame {
    position: relative;
    background: linear-gradient(135deg, var(--wood), var(--wood-dark));
    padding: 8px;
    border-radius: 14px;
    border: 2px solid #854d27;
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
  }
  .crt-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 36dvh;
    background: #050505;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid #1c1917;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .scanlines {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      rgba(18, 16, 16, 0) 50%, 
      rgba(0, 0, 0, 0.38) 50%
    );
    background-size: 100% 4px;
    pointer-events: none;
  }
  .osd {
    position: absolute;
    top: 8px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: bold;
    color: #fde047;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
  }
  /* SWITCHES BAR */
  .switches-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    background: var(--panel);
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--wood);
  }
  .sw-btn {
    background: #292524;
    color: #e7e5e4;
    border: 1px solid #78716c;
    border-radius: 5px;
    padding: 6px 2px;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sw-btn:active {
    background: var(--gold);
    color: #000;
  }
  .sw-btn.power-on {
    border-color: #22c55e;
    color: #4ade80;
  }
  /* CONTROLLER AREA (RAISED HIGH FOR THUMBS) */
  .controls-panel {
    background: var(--panel);
    border: 2px solid var(--wood);
    border-radius: 12px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  /* CX40 VIRTUAL STICK */
  .joy-zone {
    position: relative;
    width: 145px;
    height: 145px;
    background: #0c0a09;
    border: 2px dashed var(--orange);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    flex-shrink: 0;
  }
  .joy-ring {
    width: 104px;
    height: 104px;
    border: 2px solid #44403c;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .joy-stick {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle at 35% 35%, #f59e0b, #b45309);
    border: 3px solid #fde047;
    border-radius: 50%;
    position: absolute;
    transform: translate(0px, 0px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .dir-arrow {
    position: absolute;
    color: #78716c;
    font-size: 10px;
    pointer-events: none;
  }
  .dir-u { top: 4px; left: 50%; transform: translateX(-50%); }
  .dir-d { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .dir-l { left: 5px; top: 50%; transform: translateY(-50%); }
  .dir-r { right: 5px; top: 50%; transform: translateY(-50%); }

  /* RIGHT ACTION BUTTONS */
  .action-zone {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: flex-end;
    flex: 1;
  }
  .turbo-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle, #d97706, #78350f);
    border: 2px solid #fde047;
    color: #fff;
    font-weight: 900;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6);
  }
  .turbo-btn.active {
    background: #22c55e;
    color: #000;
    box-shadow: 0 0 12px #22c55e;
  }
  .fire-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ef4444, #991b1b);
    border: 4px solid #f87171;
    color: #fff;
    font-weight: 900;
    font-size: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    box-shadow: 0 6px 14px rgba(220, 38, 38, 0.5);
  }
  .fire-btn:active, .fire-btn.pressed {
    transform: scale(0.93);
    background: #dc2626;
  }
  .fire-sub {
    font-size: 9px;
    opacity: 0.85;
    margin-top: 2px;
  }
  /* 6507 DEBUGGER DRAWER */
  .debug-box {
    display: none;
    background: #0c0a09;
    border: 1px solid #15803d;
    color: #4ade80;
    padding: 8px;
    border-radius: 8px;
    font-size: 11px;
    line-height: 1.4;
  }
  .debug-box.show {
    display: block;
  }
</style>
</head>
<body>

<div class="app">
  <!-- NAGŁÓWEK -->
  <div class="topbar">
    <div class="brand">
      <span>🕹️ ATARI 2600</span>
      <span class="badge">CX2600</span>
    </div>
    <div class="top-actions">
      <button class="btn" id="langBtn">🇵🇱 PL</button>
      <button class="btn" id="soundBtn">🔊 ON</button>
      <button class="btn" id="debugBtn">[6507]</button>
    </div>
  </div>

  <!-- SZYBKI WYBÓR GRY (DOTYKOWE KAFELKI) -->
  <div class="cart-bar" id="cartBar">
    <button class="cart-btn active" data-game="0">🪖<br>COMBAT</button>
    <button class="cart-btn" data-game="1">👾<br>INVADERS</button>
    <button class="cart-btn" data-game="2">🏃<br>PITFALL</button>
    <button class="cart-btn" data-game="3">🧱<br>BREAKOUT</button>
    <button class="cart-btn" data-game="4">🐉<br>ADVENTURE</button>
  </div>

  <!-- EKRAN TELEWIZORA CRT -->
  <div class="tv-frame">
    <div class="crt-wrap" id="crtWrap">
      <canvas id="tiaCanvas" width="160" height="192"></canvas>
      <div class="scanlines"></div>
      <div class="osd">
        <span id="osdTitle">COMBAT (1977)</span>
        <span id="osdScore">P1: 0 | CPU: 0</span>
      </div>
    </div>
  </div>

  <!-- PRZEŁĄCZNIKI KONSOLI -->
  <div class="switches-bar">
    <button class="sw-btn power-on" id="swPower">PWR: ON</button>
    <button class="sw-btn" id="swSelect">SELECT</button>
    <button class="sw-btn" id="swReset">RESET</button>
    <button class="sw-btn" id="swColor">COLOR</button>
    <button class="sw-btn" id="swDiff">DIFF: B</button>
  </div>

  <!-- KONTROLER DOTYKOWY (WYSOKO POD EKRANEM) -->
  <div class="controls-panel">
    <div class="joy-zone" id="joyZone">
      <span class="dir-arrow dir-u">▲</span>
      <span class="dir-arrow dir-d">▼</span>
      <span class="dir-arrow dir-l">◄</span>
      <span class="dir-arrow dir-r">►</span>
      <div class="joy-ring">
        <div class="joy-stick" id="joyStick"></div>
      </div>
    </div>

    <div class="action-zone">
      <button class="turbo-btn" id="turboBtn">
        <span>TURBO</span>
        <span style="font-size:8px">AUTO</span>
      </button>
      <button class="fire-btn" id="fireBtn">
        <span>FIRE</span>
        <span class="fire-sub" id="fireSub">STRZAŁ</span>
      </button>
    </div>
  </div>

  <!-- ANALIZATOR 6507 -->
  <div class="debug-box" id="debugBox">
    <div>MOS 6507 CPU | PC: <span id="regPC">$F000</span> | A: <span id="regA">$00</span> | X: <span id="regX">$00</span> | Y: <span id="regY">$00</span></div>
    <div>TIA 160x192 NTSC | SWCHA: <span id="regSWCHA">%11111111</span> | FPS: 60</div>
  </div>
</div>

<script>
(() => {
  // --- KONFIGURACJA JĘZYKA ---
  let lang = 'pl';
  const i18n = {
    pl: {
      fireSub: 'STRZAŁ',
      powerOn: 'PWR: WŁ',
      powerOff: 'PWR: WYŁ',
      color: 'KOLOR',
      bw: 'CZ-B',
      selectMsg: 'WARIANT GRY: ',
      resetMsg: 'RESET GRY!',
      winMsg: 'ZWYCIĘSTWO!'
    },
    en: {
      fireSub: 'SPACE',
      powerOn: 'PWR: ON',
      powerOff: 'PWR: OFF',
      color: 'COLOR',
      bw: 'B&W',
      selectMsg: 'GAME MODE: ',
      resetMsg: 'GAME RESET!',
      winMsg: 'YOU WIN!'
    }
  };

  // --- DŹWIĘK WEB AUDIO (TIA 2-CHANNEL SYNTH) ---
  let audioCtx = null;
  let soundEnabled = true;

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq = 440, dur = 0.08, type = 'square', vol = 0.12) {
    if (!soundEnabled) return;
    unlockAudio();
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  // --- STAN KONSOLI I WEJŚĆ ---
  const canvas = document.getElementById('tiaCanvas');
  const ctx = canvas.getContext('2d');
  let powerOn = true;
  let colorMode = true;
  let diffHard = false;
  let currentGame = 0;
  let gameVariant = 1;
  let turboActive = false;
  let frameCount = 0;

  const input = { up: false, down: false, left: false, right: false, fire: false };
  let fireCooldown = 0;

  // --- DANE GIER ---
  const games = [
    { name: 'COMBAT (1977)', scoreP1: 0, scoreCPU: 0 },
    { name: 'SPACE INVADERS', scoreP1: 0, scoreCPU: 3 },
    { name: 'PITFALL! (1982)', scoreP1: 2000, scoreCPU: 3 },
    { name: 'SUPER BREAKOUT', scoreP1: 0, scoreCPU: 5 },
    { name: 'ADVENTURE (1980)', scoreP1: 0, scoreCPU: 1 }
  ];

  // 1. COMBAT STATE
  const combat = {
    p1: { x: 25, y: 96, dir: 0, vx: 1, vy: 0 },
    cpu: { x: 135, y: 96, dir: 4, vx: -1, vy: 0 },
    bullets: []
  };

  // 2. SPACE INVADERS STATE
  const invaders = {
    px: 80,
    aliens: [],
    dir: 1,
    speed: 0.35,
    bullets: [],
    enemyBullets: []
  };

  // 3. PITFALL STATE
  const pitfall = {
    px: 24, py: 126, vy: 0, jumping: false,
    logs: [{ x: 150 }, { x: 220 }],
    goldX: 120
  };

  // 4. BREAKOUT STATE
  const breakout = {
    px: 64,
    bx: 80, by: 120, bvx: 1.4, bvy: -1.6,
    bricks: []
  };

  // 5. ADVENTURE STATE
  const adventure = {
    px: 80, py: 150,
    keyX: 30, keyY: 50, hasKey: false,
    chaliceX: 130, chaliceY: 35,
    dragonX: 80, dragonY: 85,
    room: 0
  };

  function initGame(idx) {
    currentGame = idx;
    document.querySelectorAll('.cart-btn').forEach((b, i) => {
      b.classList.toggle('active', i === idx);
    });
    document.getElementById('osdTitle').textContent = games[idx].name + ' [' + gameVariant + ']';

    // Reset Combat
    combat.p1 = { x: 25, y: 96 };
    combat.cpu = { x: 135, y: 96 };
    combat.bullets = [];

    // Reset Invaders
    invaders.px = 75;
    invaders.bullets = [];
    invaders.enemyBullets = [];
    invaders.aliens = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 7; c++) {
        invaders.aliens.push({ x: 18 + c * 18, y: 24 + r * 14, alive: true, row: r });
      }
    }

    // Reset Pitfall
    pitfall.px = 24; pitfall.py = 126; pitfall.vy = 0; pitfall.jumping = false;
    pitfall.logs = [{ x: 125 }, { x: 195 }];
    pitfall.goldX = 135;

    // Reset Breakout
    breakout.px = 64;
    breakout.bx = 80; breakout.by = 115;
    breakout.bvx = 1.4 * (Math.random() > 0.5 ? 1 : -1);
    breakout.bvy = -1.6;
    breakout.bricks = [];
    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 10; c++) {
        breakout.bricks.push({ x: 6 + c * 15, y: 26 + r * 8, alive: true, color: colors[r] });
      }
    }

    // Reset Adventure
    adventure.px = 80; adventure.py = 155;
    adventure.hasKey = false;
    adventure.dragonX = 80; adventure.dragonY = 85;

    updateScoreOSD();
    playTone(520, 0.1, 'square');
  }

  function updateScoreOSD() {
    const g = games[currentGame];
    const osd = document.getElementById('osdScore');
    if (currentGame === 0) osd.textContent = `P1: ${g.scoreP1} | CPU: ${g.scoreCPU}`;
    else if (currentGame === 1) osd.textContent = `SCORE: ${g.scoreP1} | ♥${g.scoreCPU}`;
    else if (currentGame === 2) osd.textContent = `PTS: ${g.scoreP1}`;
    else if (currentGame === 3) osd.textContent = `SCORE: ${g.scoreP1} | ●${g.scoreCPU}`;
    else if (currentGame === 4) osd.textContent = adventure.hasKey ? `KEY: YES | WINS: ${g.scoreP1}` : `FIND KEY | WINS: ${g.scoreP1}`;
  }

  // --- FILTR KOLORÓW NTSC / B&W ---
  function c(hex, grayHex) {
    return colorMode ? hex : (grayHex || '#a8a29e');
  }

  // --- LOGIKA I RENDEROWANIE GIER (60 FPS) ---
  function updateAndRender() {
    frameCount++;

    if (!powerOn) {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, 160, 192);
      return;
    }

    const speedMult = diffHard ? 1.35 : 1.0;
    const firing = input.fire || (turboActive && frameCount % 8 === 0);
    if (fireCooldown > 0) fireCooldown--;

    // ================== GRA 0: COMBAT ==================
    if (currentGame === 0) {
      ctx.fillStyle = c('#7c2d12', '#262626');
      ctx.fillRect(0, 0, 160, 192);

      // Mur środkowy
      ctx.fillStyle = c('#fbbf24', '#a3a3a3');
      ctx.fillRect(76, 45, 8, 102);
      ctx.fillRect(45, 25, 70, 6);
      ctx.fillRect(45, 160, 70, 6);

      // Ruch Gracza
      const s = 1.3 * speedMult;
      if (input.left) combat.p1.x = Math.max(8, combat.p1.x - s);
      if (input.right) combat.p1.x = Math.min(144, combat.p1.x + s);
      if (input.up) combat.p1.y = Math.max(18, combat.p1.y - s);
      if (input.down) combat.p1.y = Math.min(174, combat.p1.y + s);

      // Strzał Gracza
      if (firing && fireCooldown === 0) {
        combat.bullets.push({ x: combat.p1.x + 8, y: combat.p1.y + 3, vx: 2.8, vy: input.up ? -1 : (input.down ? 1 : 0), owner: 1 });
        fireCooldown = 18;
        playTone(220, 0.07, 'sawtooth');
      }

      // AI CPU
      if (combat.cpu.y < combat.p1.y) combat.cpu.y += 0.65 * speedMult;
      if (combat.cpu.y > combat.p1.y) combat.cpu.y -= 0.65 * speedMult;
      if (frameCount % 55 === 0) {
        combat.bullets.push({ x: combat.cpu.x - 4, y: combat.cpu.y + 3, vx: -2.4 * speedMult, vy: 0, owner: 2 });
        playTone(180, 0.06, 'sawtooth');
      }

      // Czołg P1
      ctx.fillStyle = c('#38bdf8', '#e5e5e5');
      ctx.fillRect(combat.p1.x, combat.p1.y, 9, 9);
      ctx.fillRect(combat.p1.x + 8, combat.p1.y + 3, 4, 3);

      // Czołg CPU
      ctx.fillStyle = c('#4ade80', '#737373');
      ctx.fillRect(combat.cpu.x, combat.cpu.y, 9, 9);
      ctx.fillRect(combat.cpu.x - 4, combat.cpu.y + 3, 4, 3);

      // Pociski
      ctx.fillStyle = '#fff';
      for (let i = combat.bullets.length - 1; i >= 0; i--) {
        const b = combat.bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        ctx.fillRect(b.x, b.y, 3, 3);

        // Odbicie od muru
        if (b.x > 75 && b.x < 85 && b.y > 45 && b.y < 147) {
          if (gameVariant === 2) b.vx = -b.vx;
          else { combat.bullets.splice(i, 1); continue; }
        }
        // Trafienie CPU
        if (b.owner === 1 && Math.abs(b.x - combat.cpu.x) < 9 && Math.abs(b.y - combat.cpu.y) < 9) {
          games[0].scoreP1++;
          combat.cpu.y = 25 + Math.random() * 140;
          combat.bullets.splice(i, 1);
          updateScoreOSD();
          playTone(110, 0.2, 'sawtooth');
          continue;
        }
        // Trafienie Gracza
        if (b.owner === 2 && Math.abs(b.x - combat.p1.x) < 9 && Math.abs(b.y - combat.p1.y) < 9) {
          games[0].scoreCPU++;
          combat.p1.y = 25 + Math.random() * 140;
          combat.bullets.splice(i, 1);
          updateScoreOSD();
          playTone(90, 0.25, 'sawtooth');
          continue;
        }
        if (b.x < 0 || b.x > 160 || b.y < 0 || b.y > 192) combat.bullets.splice(i, 1);
      }
    }

    // ================== GRA 1: SPACE INVADERS ==================
    else if (currentGame === 1) {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, 160, 192);

      if (input.left) invaders.px = Math.max(10, invaders.px - 1.8);
      if (input.right) invaders.px = Math.min(140, invaders.px + 1.8);

      if (firing && fireCooldown === 0) {
        invaders.bullets.push({ x: invaders.px + 5, y: 168 });
        fireCooldown = 16;
        playTone(680, 0.06, 'square');
      }

      // Ruch Obcych
      let hitEdge = false;
      let aliveCount = 0;
      invaders.aliens.forEach(a => {
        if (!a.alive) return;
        aliveCount++;
        a.x += invaders.dir * invaders.speed * speedMult;
        if (a.x > 146 || a.x < 6) hitEdge = true;
      });
      if (hitEdge) {
        invaders.dir = -invaders.dir;
        invaders.aliens.forEach(a => { a.y += 5; });
      }
      if (aliveCount === 0) initGame(1);

      // Rysowanie Obcych
      const rowCols = ['#f43f5e', '#fb923c', '#facc15', '#4ade80'];
      invaders.aliens.forEach(a => {
        if (!a.alive) return;
        ctx.fillStyle = c(rowCols[a.row], '#d4d4d4');
        ctx.fillRect(a.x, a.y, 10, 7);
        ctx.fillRect(a.x + 2, a.y - 2, 6, 2);
      });

      // Działo Gracza
      ctx.fillStyle = c('#38bdf8', '#ffffff');
      ctx.fillRect(invaders.px, 172, 12, 6);
      ctx.fillRect(invaders.px + 4, 168, 4, 4);

      // Pociski
      ctx.fillStyle = '#fde047';
      for (let i = invaders.bullets.length - 1; i >= 0; i--) {
        const b = invaders.bullets[i];
        b.y -= 3.4;
        ctx.fillRect(b.x, b.y, 2, 5);
        invaders.aliens.forEach(a => {
          if (a.alive && b.x >= a.x && b.x <= a.x + 10 && b.y >= a.y && b.y <= a.y + 8) {
            a.alive = false;
            b.y = -10;
            games[1].scoreP1 += 25;
            updateScoreOSD();
            playTone(310, 0.09, 'sawtooth');
          }
        });
        if (b.y < 0) invaders.bullets.splice(i, 1);
      }
    }

    // ================== GRA 2: PITFALL! ==================
    else if (currentGame === 2) {
      // Niebo i dżungla
      ctx.fillStyle = c('#14532d', '#262626');
      ctx.fillRect(0, 0, 160, 136);
      // Ziemia
      ctx.fillStyle = c('#ca8a04', '#737373');
      ctx.fillRect(0, 136, 160, 22);
      // Podziemia
      ctx.fillStyle = c('#451a03', '#171717');
      ctx.fillRect(0, 158, 160, 34);

      // Drzewa
      ctx.fillStyle = c('#78350f', '#525252');
      [20, 65, 110, 145].forEach(tx => ctx.fillRect(tx, 15, 8, 121));

      // Ruch Harry'ego
      if (input.left) pitfall.px = Math.max(8, pitfall.px - 1.5);
      if (input.right) pitfall.px = Math.min(146, pitfall.px + 1.5);
      if ((input.up || firing) && !pitfall.jumping) {
        pitfall.vy = -4.3;
        pitfall.jumping = true;
        playTone(480, 0.09, 'square');
      }

      pitfall.py += pitfall.vy;
      if (pitfall.py < 124) pitfall.vy += 0.25;
      else {
        pitfall.py = 124;
        pitfall.vy = 0;
        pitfall.jumping = false;
      }

      // Kłody
      ctx.fillStyle = c('#92400e', '#a3a3a3');
      pitfall.logs.forEach(log => {
        log.x -= 1.4 * speedMult;
        if (log.x < -10) log.x = 165;
        ctx.fillRect(log.x, 129, 8, 7);
        if (Math.abs(log.x - pitfall.px) < 7 && pitfall.py > 120) {
          games[2].scoreP1 = Math.max(0, games[2].scoreP1 - 10);
          updateScoreOSD();
          playTone(130, 0.05, 'sawtooth');
        }
      });

      // Złoto
      ctx.fillStyle = c('#fde047', '#ffffff');
      ctx.fillRect(pitfall.goldX, 126, 7, 6);
      if (Math.abs(pitfall.px - pitfall.goldX) < 9 && Math.abs(pitfall.py - 124) < 10) {
        games[2].scoreP1 += 500;
        pitfall.goldX = 20 + Math.random() * 125;
        updateScoreOSD();
        playTone(880, 0.15, 'square');
      }

      // Gracz
      ctx.fillStyle = c('#22c55e', '#ffffff');
      ctx.fillRect(pitfall.px, pitfall.py, 7, 12);
    }

    // ================== GRA 3: SUPER BREAKOUT ==================
    else if (currentGame === 3) {
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, 160, 192);

      const padW = diffHard ? 20 : 28;
      if (input.left) breakout.px = Math.max(4, breakout.px - 2.4);
      if (input.right) breakout.px = Math.min(156 - padW, breakout.px + 2.4);

      // Paletka
      ctx.fillStyle = c('#38bdf8', '#ffffff');
      ctx.fillRect(breakout.px, 174, padW, 5);

      // Piłeczka
      breakout.bx += breakout.bvx * speedMult;
      breakout.by += breakout.bvy * speedMult;

      if (breakout.bx < 4 || breakout.bx > 154) {
        breakout.bvx = -breakout.bvx;
        playTone(340, 0.04);
      }
      if (breakout.by < 14) {
        breakout.bvy = -breakout.bvy;
        playTone(400, 0.04);
      }

      // Odbicie od paletki
      if (breakout.by >= 170 && breakout.by <= 178 && breakout.bx >= breakout.px - 2 && breakout.bx <= breakout.px + padW + 2) {
        breakout.bvy = -Math.abs(breakout.bvy);
        playTone(520, 0.05);
      }

      // Utrata piłki
      if (breakout.by > 190) {
        breakout.bx = 80; breakout.by = 110;
        breakout.bvy = -1.6;
        playTone(140, 0.2, 'sawtooth');
      }

      // Cegiełki
      let leftBricks = 0;
      breakout.bricks.forEach(br => {
        if (!br.alive) return;
        leftBricks++;
        ctx.fillStyle = c(br.color, '#d4d4d4');
        ctx.fillRect(br.x, br.y, 13, 6);
        if (breakout.bx >= br.x && breakout.bx <= br.x + 13 && breakout.by >= br.y && breakout.by <= br.y + 6) {
          br.alive = false;
          breakout.bvy = -breakout.bvy;
          games[3].scoreP1 += 10;
          updateScoreOSD();
          playTone(660, 0.05);
        }
      });
      if (leftBricks === 0) initGame(3);

      ctx.fillStyle = '#fff';
      ctx.fillRect(breakout.bx, breakout.by, 4, 4);
    }

    // ================== GRA 4: ADVENTURE ==================
    else if (currentGame === 4) {
      ctx.fillStyle = c('#3f3f46', '#262626');
      ctx.fillRect(0, 0, 160, 192);

      // Mury zamku
      ctx.fillStyle = c('#eab308', '#a3a3a3');
      ctx.fillRect(10, 16, 140, 8);
      ctx.fillRect(10, 16, 8, 160);
      ctx.fillRect(142, 16, 8, 160);

      // Ruch Gracza (Kwadrat)
      const sp = 1.6;
      if (input.left) adventure.px = Math.max(20, adventure.px - sp);
      if (input.right) adventure.px = Math.min(134, adventure.px + sp);
      if (input.up) adventure.py = Math.max(26, adventure.py - sp);
      if (input.down) adventure.py = Math.min(176, adventure.py + sp);

      // Złoty Klucz
      if (!adventure.hasKey) {
        ctx.fillStyle = c('#fde047', '#ffffff');
        ctx.fillRect(adventure.keyX, adventure.keyY, 8, 4);
        if (Math.abs(adventure.px - adventure.keyX) < 9 && Math.abs(adventure.py - adventure.keyY) < 9) {
          adventure.hasKey = true;
          updateScoreOSD();
          playTone(740, 0.12);
        }
      } else {
        // Złoty Kielich pojawia się po wzięciu klucza
        ctx.fillStyle = c('#f43f5e', '#ffffff');
        ctx.fillRect(adventure.chaliceX, adventure.chaliceY, 9, 11);
        if (Math.abs(adventure.px - adventure.chaliceX) < 10 && Math.abs(adventure.py - adventure.chaliceY) < 10) {
          games[4].scoreP1++;
          adventure.hasKey = false;
          adventure.px = 80; adventure.py = 160;
          updateScoreOSD();
          playTone(920, 0.25);
        }
      }

      // Smok Yorgle
      if (adventure.dragonX < adventure.px) adventure.dragonX += 0.55 * speedMult;
      if (adventure.dragonX > adventure.px) adventure.dragonX -= 0.55 * speedMult;
      if (adventure.dragonY < adventure.py) adventure.dragonY += 0.55 * speedMult;
      if (adventure.dragonY > adventure.py) adventure.dragonY -= 0.55 * speedMult;

      ctx.fillStyle = c('#22c55e', '#a3a3a3');
      ctx.fillRect(adventure.dragonX, adventure.dragonY, 11, 13);

      if (Math.abs(adventure.px - adventure.dragonX) < 9 && Math.abs(adventure.py - adventure.dragonY) < 9) {
        adventure.px = 80; adventure.py = 165;
        adventure.hasKey = false;
        updateScoreOSD();
        playTone(120, 0.2, 'sawtooth');
      }

      // Bohater
      ctx.fillStyle = c('#38bdf8', '#ffffff');
      ctx.fillRect(adventure.px, adventure.py, 7, 7);
    }

    // Aktualizacja rejestrów 6507 na żywo
    if (frameCount % 6 === 0) {
      document.getElementById('regPC').textContent = '$F' + ((frameCount * 7) & 0xFFF).toString(16).toUpperCase().padStart(3, '0');
      document.getElementById('regA').textContent = '$' + ((combat.p1.x | 0) & 0xFF).toString(16).toUpperCase().padStart(2, '0');
      document.getElementById('regX').textContent = '$' + ((combat.p1.y | 0) & 0xFF).toString(16).toUpperCase().padStart(2, '0');
      const swcha = [
        input.right ? 0 : 1,
        input.left ? 0 : 1,
        input.down ? 0 : 1,
        input.up ? 0 : 1,
        1, 1, 1, 1
      ].join('');
      document.getElementById('regSWCHA').textContent = '%' + swcha;
    }

    requestAnimationFrame(updateAndRender);
  }

  // --- OBSŁUGA DOTYKOWEGO DRĄŻKA CX40 (MULTI-TOUCH) ---
  const joyZone = document.getElementById('joyZone');
  const joyStick = document.getElementById('joyStick');
  let joyTouchId = null;

  function handleJoystickMove(clientX, clientY) {
    const rect = joyZone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const maxR = 36;
    const dist = Math.hypot(dx, dy);
    if (dist > maxR) {
      dx = (dx / dist) * maxR;
      dy = (dy / dist) * maxR;
    }
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;

    const deadzone = 10;
    input.left = dx < -deadzone;
    input.right = dx > deadzone;
    input.up = dy < -deadzone;
    input.down = dy > deadzone;
  }

  function resetJoystick() {
    joyTouchId = null;
    joyStick.style.transform = `translate(0px, 0px)`;
    input.left = input.right = input.up = input.down = false;
  }

  joyZone.addEventListener('touchstart', e => {
    e.preventDefault();
    unlockAudio();
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    handleJoystickMove(t.clientX, t.clientY);
  }, { passive: false });

  joyZone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', e => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) resetJoystick();
    }
  });
  joyZone.addEventListener('touchcancel', resetJoystick);

  // Obsługa myszy na PC
  let mouseDownJoy = false;
  joyZone.addEventListener('mousedown', e => { mouseDownJoy = true; unlockAudio(); handleJoystickMove(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => { if (mouseDownJoy) handleJoystickMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (mouseDownJoy) { mouseDownJoy = false; resetJoystick(); } });

  // --- PRZYCISK FIRE I TURBO ---
  const fireBtn = document.getElementById('fireBtn');
  fireBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    unlockAudio();
    input.fire = true;
    fireBtn.classList.add('pressed');
    if (navigator.vibrate) navigator.vibrate(15);
  }, { passive: false });

  fireBtn.addEventListener('touchend', e => {
    e.preventDefault();
    input.fire = false;
    fireBtn.classList.remove('pressed');
  });
  fireBtn.addEventListener('mousedown', () => { unlockAudio(); input.fire = true; });
  window.addEventListener('mouseup', () => { input.fire = false; });

  const turboBtn = document.getElementById('turboBtn');
  turboBtn.addEventListener('click', () => {
    unlockAudio();
    turboActive = !turboActive;
    turboBtn.classList.toggle('active', turboActive);
  });

  // --- KAFELKI WYBORU GRY ---
  document.querySelectorAll('.cart-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      unlockAudio();
      const gIdx = parseInt(btn.getAttribute('data-game'), 10);
      initGame(gIdx);
    });
  });

  // --- PRZEŁĄCZNIKI KONSOLI ---
  const swPower = document.getElementById('swPower');
  swPower.addEventListener('click', () => {
    powerOn = !powerOn;
    swPower.classList.toggle('power-on', powerOn);
    swPower.textContent = powerOn ? i18n[lang].powerOn : i18n[lang].powerOff;
    playTone(powerOn ? 600 : 200, 0.08);
  });

  document.getElementById('swSelect').addEventListener('click', () => {
    gameVariant = (gameVariant % 3) + 1;
    initGame(currentGame);
  });

  document.getElementById('swReset').addEventListener('click', () => {
    games[currentGame].scoreP1 = 0;
    games[currentGame].scoreCPU = 0;
    initGame(currentGame);
  });

  const swColor = document.getElementById('swColor');
  swColor.addEventListener('click', () => {
    colorMode = !colorMode;
    swColor.textContent = colorMode ? i18n[lang].color : i18n[lang].bw;
  });

  const swDiff = document.getElementById('swDiff');
  swDiff.addEventListener('click', () => {
    diffHard = !diffHard;
    swDiff.textContent = diffHard ? 'DIFF: A' : 'DIFF: B';
  });

  // --- JĘZYK PL / EN ---
  const langBtn = document.getElementById('langBtn');
  langBtn.addEventListener('click', () => {
    lang = lang === 'pl' ? 'en' : 'pl';
    langBtn.textContent = lang === 'pl' ? '🇵🇱 PL' : '🇬🇧 EN';
    document.getElementById('fireSub').textContent = i18n[lang].fireSub;
    swPower.textContent = powerOn ? i18n[lang].powerOn : i18n[lang].powerOff;
    swColor.textContent = colorMode ? i18n[lang].color : i18n[lang].bw;
  });

  // --- DŹWIĘK ON/OFF & DEBUGGER ---
  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
  });

  const debugBtn = document.getElementById('debugBtn');
  const debugBox = document.getElementById('debugBox');
  debugBtn.addEventListener('click', () => {
    debugBox.classList.toggle('show');
  });

  // --- KLAWIATURA (PC) ---
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') input.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
    if (e.key === ' ') input.fire = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') input.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') input.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
    if (e.key === ' ') input.fire = false;
  });

  // Start automatyczny przy załadowaniu
  initGame(0);
  requestAnimationFrame(updateAndRender);
})();
</script>
</body>
</html>
