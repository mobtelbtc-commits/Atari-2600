<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atari 2600 VCS + 6507 ASM</title>
<style>
  :root {
    --wood: #6b3e26;
    --wood-dark: #422414;
    --gold: #f59e0b;
    --orange: #ea580c;
    --bg: #0e0e11;
    --panel: #1c1917;
    --green: #4ade80;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: #f5f5f4;
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden;
  }
  .app {
    max-width: 540px;
    margin: 0 auto;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 100dvh;
  }
  .topbar {
    background: var(--panel);
    border: 2px solid var(--wood);
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 5px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 900;
    color: var(--gold);
    font-size: 14px;
  }
  .badge {
    font-size: 9px;
    background: #14532d;
    color: var(--green);
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px solid var(--green);
  }
  .top-actions {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .btn {
    background: #292524;
    color: #fafaf9;
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 5px 7px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .btn:active, .btn.active {
    background: var(--gold);
    color: #000;
  }
  .btn-asm {
    background: #14532d;
    border-color: var(--green);
    color: var(--green);
  }
  .cart-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: var(--panel);
    padding: 5px;
    border-radius: 8px;
    border: 1px solid #44403c;
  }
  .cart-btn {
    background: #292524;
    color: #d6d3d1;
    border: 1px solid #57534e;
    border-radius: 6px;
    padding: 5px 2px;
    font-size: 9px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
    line-height: 1.15;
  }
  .cart-btn.active {
    background: var(--orange);
    color: #fff;
    border-color: #fde047;
    box-shadow: 0 0 8px rgba(234, 88, 12, 0.6);
  }
  .tv-frame {
    position: relative;
    background: linear-gradient(135deg, var(--wood), var(--wood-dark));
    padding: 7px;
    border-radius: 14px;
    border: 2px solid #854d27;
  }
  .crt-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 35dvh;
    background: #050505;
    border-radius: 10px;
    overflow: hidden;
    border: 3px solid #1c1917;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .scanlines {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.38) 50%);
    background-size: 100% 4px;
    pointer-events: none;
  }
  .osd {
    position: absolute;
    top: 6px;
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: bold;
    color: #fde047;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
  }
  .switches-bar {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    background: var(--panel);
    padding: 5px;
    border-radius: 8px;
    border: 1px solid var(--wood);
  }
  .sw-btn {
    background: #292524;
    color: #e7e5e4;
    border: 1px solid #78716c;
    border-radius: 5px;
    padding: 6px 2px;
    font-size: 10px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sw-btn:active { background: var(--gold); color: #000; }
  .sw-btn.power-on { border-color: #22c55e; color: #4ade80; }

  .controls-panel {
    background: var(--panel);
    border: 2px solid var(--wood);
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .joy-zone {
    position: relative;
    width: 138px;
    height: 138px;
    background: #0c0a09;
    border: 2px dashed var(--orange);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    flex-shrink: 0;
  }
  .joy-ring {
    width: 98px;
    height: 98px;
    border: 2px solid #44403c;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .joy-stick {
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 35% 35%, #f59e0b, #b45309);
    border: 3px solid #fde047;
    border-radius: 50%;
    position: absolute;
    transform: translate(0px, 0px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  .dir-arrow { position: absolute; color: #78716c; font-size: 10px; pointer-events: none; }
  .dir-u { top: 4px; left: 50%; transform: translateX(-50%); }
  .dir-d { bottom: 4px; left: 50%; transform: translateX(-50%); }
  .dir-l { left: 5px; top: 50%; transform: translateY(-50%); }
  .dir-r { right: 5px; top: 50%; transform: translateY(-50%); }

  .action-zone {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
    flex: 1;
  }
  .turbo-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle, #d97706, #78350f);
    border: 2px solid #fde047;
    color: #fff;
    font-weight: 900;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
  }
  .turbo-btn.active { background: #22c55e; color: #000; box-shadow: 0 0 12px #22c55e; }
  .fire-btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ef4444, #991b1b);
    border: 4px solid #f87171;
    color: #fff;
    font-weight: 900;
    font-size: 17px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
    box-shadow: 0 6px 14px rgba(220, 38, 38, 0.5);
  }
  .fire-btn:active, .fire-btn.pressed { transform: scale(0.93); background: #dc2626; }
  .fire-sub { font-size: 9px; opacity: 0.85; margin-top: 2px; }

  .asm-modal {
    display: none;
    background: #141417;
    border: 2px solid var(--green);
    border-radius: 10px;
    padding: 8px;
    font-size: 11px;
    color: #e5e7eb;
  }
  .asm-modal.show { display: block; }
  .asm-textarea {
    width: 100%;
    height: 135px;
    background: #09090b;
    color: #4ade80;
    border: 1px solid #3f3f46;
    border-radius: 6px;
    padding: 6px;
    font-family: monospace;
    font-size: 10px;
    margin: 6px 0;
    user-select: text;
    -webkit-user-select: text;
    white-space: pre;
    overflow: auto;
  }
  .hex-dump {
    background: #050505;
    color: #38bdf8;
    border: 1px solid #27272a;
    border-radius: 4px;
    padding: 5px;
    font-size: 9px;
    height: 52px;
    overflow-y: auto;
    margin-top: 5px;
    font-family: monospace;
    white-space: pre-wrap;
  }
  .debug-box {
    background: #0c0a09;
    border: 1px solid #15803d;
    color: var(--green);
    padding: 6px 8px;
    border-radius: 8px;
    font-size: 10px;
    line-height: 1.35;
  }
  .asm-line { color: #fde047; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <span>🕹️ ATARI 2600</span>
      <span class="badge">6507 ASM COMPILER</span>
    </div>
    <div class="top-actions">
      <button class="btn btn-asm" id="asmBtn">⚙️ Edytor ASM</button>
      <button class="btn" id="langBtn">🇵🇱 PL</button>
      <button class="btn" id="soundBtn">🔊 ON</button>
    </div>
  </div>

  <!-- EDYTOR I KOMPILATOR 6507 ASM -->
  <div class="asm-modal" id="asmModal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong style="color:#4ade80;">⚙️ Kompilator MOS 6507 (Space Invaders.asm)</strong>
      <button class="btn" id="closeAsmBtn">✕ Zamknij</button>
    </div>
    <textarea class="asm-textarea" id="asmInput" spellcheck="false"></textarea>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="btn btn-asm" id="compileAsmBtn">⚡ Asembluj do ROM i Uruchom</button>
      <button class="btn" id="fetchGithubBtn">🌐 Pobierz z GitHub (Julio-Rats)</button>
      <span id="asmStatus" style="font-size:10px; color:#fde047; align-self:center;">Gotowy</span>
    </div>
    <div class="hex-dump" id="hexDumpBox">ROM HEX DUMP ($F000):</div>
  </div>

  <!-- WYBÓR GRY -->
  <div class="cart-bar">
    <button class="cart-btn" data-game="0">🪖<br>COMBAT</button>
    <button class="cart-btn active" data-game="1">👾<br>INVADERS</button>
    <button class="cart-btn" data-game="2">🏃<br>PITFALL</button>
    <button class="cart-btn" data-game="3">🧱<br>BREAKOUT</button>
    <button class="cart-btn" data-game="4">🐉<br>ADVENTURE</button>
  </div>

  <!-- TELEWIZOR CRT -->
  <div class="tv-frame">
    <div class="crt-wrap">
      <canvas id="tiaCanvas" width="160" height="192"></canvas>
      <div class="scanlines"></div>
      <div class="osd">
        <span id="osdTitle">SPACE INVADERS (6507 ROM)</span>
        <span id="osdScore">SCORE: 0000 | ♥3</span>
      </div>
    </div>
  </div>

  <!-- PRZEŁĄCZNIKI -->
  <div class="switches-bar">
    <button class="sw-btn power-on" id="swPower">PWR: WŁ</button>
    <button class="sw-btn" id="swSelect">SELECT</button>
    <button class="sw-btn" id="swReset">RESET</button>
    <button class="sw-btn" id="swColor">KOLOR</button>
    <button class="sw-btn" id="swDiff">DIFF: B</button>
  </div>

  <!-- KONTROLER DOTYKOWY -->
  <div class="controls-panel">
    <div class="joy-zone" id="joyZone">
      <span class="dir-arrow dir-u">▲</span>
      <span class="dir-arrow dir-d">▼</span>
      <span class="dir-arrow dir-l">◄</span>
      <span class="dir-arrow dir-r">►</span>
      <div class="joy-ring">
        <div class="joy-stick" id="joyStick"></div>
      </div>
    </div>

    <div class="action-zone">
      <button class="turbo-btn" id="turboBtn">
        <span>TURBO</span>
        <span style="font-size:8px">AUTO</span>
      </button>
      <button class="fire-btn" id="fireBtn">
        <span>FIRE</span>
        <span class="fire-sub" id="fireSub">STRZAŁ</span>
      </button>
    </div>
  </div>

  <!-- PASEK STANU PROCESORA 6507 -->
  <div class="debug-box" id="debugBox">
    <div>6507 CPU | PC: <span id="regPC">$F000</span> | A: <span id="regA">$00</span> | X: <span id="regX">$FF</span> | Y: <span id="regY">$00</span> | ROM: <span id="romBytesCount">156</span>B</div>
    <div class="asm-line" id="asmLiveLine">EXEC: LDA AlienSpritesF0,Y ; STA GRP0</div>
  </div>
</div>

<script>
(function() {
  // 1. PAMIĘĆ ROM ($F000-$FFFF) Z DOMYŚLNIE ZAŁADOWANYMI SPRITE'AMI SPACE INVADERS
  var ROM = new Uint8Array(4096);
  var RAM = new Uint8Array(256);
  var cpu = { PC: 0xF000, A: 0xC6, X: 0xFF, Y: 0x07 };
  var compiledInstructions = [];
  var instCursor = 0;

  // Domyślny kod źródłowy 6507 ASM (Space Invaders CX2632)
  var DEFAULT_ASM = [
    "; SPACE INVADERS (Atari 2600 CX2632) - 6507 Assembly",
    "    PROCESSOR 6502",
    "COLUP0 = $06",
    "COLUPF = $08",
    "COLUBK = $09",
    "GRP0   = $1B",
    "GRP1   = $1C",
    "WSYNC  = $02",
    "    ORG $F000",
    "StartKernel:",
    "    SEI",
    "    CLD",
    "    LDX #$FF",
    "    TXS",
    "    LDA #$00",
    "    STA COLUBK      ; Kolor tla ($00 = czarny)",
    "    LDA #$C6",
    "    STA COLUP0      ; Kolor dziala gracza ($C6 = zielony)",
    "    LDA #$26",
    "    STA COLUPF      ; Kolor bunkrow ($26 = pomaranczowy)",
    "MainLoop:",
    "    LDY #$07",
    "DrawAlienLoop:",
    "    STA WSYNC",
    "    LDA AlienFrame0,Y",
    "    STA GRP0",
    "    DEY",
    "    BPL DrawAlienLoop",
    "    JMP MainLoop",
    "",
    "; --- TABLICE SPRITE'OW W ROM ($F100) ---",
    "    ORG $F100",
    "AlienFrame0:",
    "    .byte %00011000, %00111100, %01111110, %11011011, %11111111, %00100100, %01011010, %10100101",
    "    .byte %00100100, %01111110, %11011011, %11111111, %10111101, %10100101, %00011000, %00100100",
    "    .byte %00111100, %01111110, %11111111, %11011011, %11111111, %00100100, %01011010, %10000001",
    "    .byte %00111100, %01000010, %11011011, %11111111, %01111110, %00100100, %01000010, %10000001",
    "    .byte %01111110, %11011011, %11111111, %01111110, %00100100, %01011010, %10100101, %01000010",
    "    .byte %00111100, %01111110, %10111101, %11111111, %01011010, %00100100, %01000010, %10000001",
    "AlienFrame1:",
    "    .byte %00011000, %00111100, %01111110, %11011011, %11111111, %01011010, %10000001, %01000010",
    "    .byte %00100100, %10111101, %11011011, %11111111, %01111110, %00100100, %01000010, %10000001",
    "    .byte %00111100, %01111110, %11111111, %11011011, %11111111, %01011010, %00100100, %01011010",
    "    .byte %00111100, %01000010, %11011011, %11111111, %01111110, %01011010, %10000001, %01000010",
    "    .byte %01111110, %11011011, %11111111, %01111110, %01011010, %00100100, %01000010, %10000001",
    "    .byte %00111100, %01111110, %10111101, %11111111, %00100100, %01011010, %10000001, %01000010",
    "UfoAndCannon:",
    "    .byte %00011000, %00111100, %01111110, %11011011, %11111111, %00100100, %00000000, %00000000",
    "    .byte %00011000, %00011000, %00111100, %01111110, %11111111, %11111111, %11111111, %00000000"
  ].join("\n");

  var OPCODES = {
    SEI: 0x78, CLD: 0xD8, TXS: 0x9A, DEX: 0xCA, DEY: 0x88, INX: 0xE8, INY: 0xC8, NOP: 0xEA, RTS: 0x60,
    LDA_IMM: 0xA9, LDA_ABS: 0xAD, LDA_ABSY: 0xB9,
    LDX_IMM: 0xA2, LDY_IMM: 0xA0,
    STA_ZP: 0x85, STA_ABS: 0x8D,
    BNE: 0xD0, BEQ: 0xF0, BPL: 0x10, BMI: 0x30, JMP: 0x4C, JSR: 0x20
  };

  function parseVal(str, syms) {
    if (!str) return 0;
    str = str.trim();
    if (syms && syms[str] !== undefined) return syms[str];
    if (str.charAt(0) === '$') return parseInt(str.slice(1), 16) || 0;
    if (str.charAt(0) === '%') return parseInt(str.slice(1), 2) || 0;
    return parseInt(str, 10) || 0;
  }

  function assemble6507(src) {
    try {
      var syms = {};
      var lines = src.split(/\r?\n/);
      var pc = 0xF000;
      var items = [];

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].split(';')[0].trim();
        if (!line) continue;

        var eq = line.match(/^([A-Za-z0-9_]+)\s*=\s*(.+)$/);
        if (eq) {
          syms[eq[1].trim()] = parseVal(eq[2], syms);
          continue;
        }
        if (line.indexOf(':') !== -1) {
          var lp = line.split(':');
          syms[lp[0].trim()] = pc;
          line = lp.slice(1).join(':').trim();
          if (!line) continue;
        }
        var parts = line.split(/\s+/);
        var mnem = parts[0].toUpperCase();
        var arg = parts.slice(1).join(' ').trim();

        if (mnem === 'PROCESSOR') continue;
        if (mnem === 'ORG' || mnem === '.ORG') {
          pc = parseVal(arg, syms);
          continue;
        }
        if (mnem === '.BYTE' || mnem === 'BYTE') {
          var bList = arg.split(',');
          items.push({ type: 'bytes', pc: pc, list: bList });
          pc += bList.length;
          continue;
        }
        items.push({ type: 'inst', pc: pc, mnem: mnem, arg: arg, raw: line });
        pc += (arg ? 2 : 1);
      }

      var total = 0;
      compiledInstructions = [];
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        var off = (it.pc - 0xF000) & 0x0FFF;
        if (it.type === 'bytes') {
          for (var k = 0; k < it.list.length; k++) {
            ROM[(off + k) & 0x0FFF] = parseVal(it.list[k], syms) & 0xFF;
            total++;
          }
        } else {
          var op = OPCODES[it.mnem] || 0xEA;
          var val = 0;
          if (it.arg) {
            var clean = it.arg.replace('#', '').replace(',Y', '').replace(',X', '').trim();
            val = parseVal(clean, syms);
            if (it.mnem === 'LDA' && it.arg.indexOf('#') === 0) op = 0xA9;
            else if (it.mnem === 'LDA') op = 0xB9;
            else if (it.mnem === 'LDX') op = 0xA2;
            else if (it.mnem === 'LDY') op = 0xA0;
            else if (it.mnem === 'STA') op = 0x85;
          }
          ROM[off] = op;
          if (it.arg) ROM[(off + 1) & 0x0FFF] = val & 0xFF;
          total += (it.arg ? 2 : 1);
          compiledInstructions.push({ pc: it.pc, op: op, val: val, mnem: it.mnem, arg: it.arg, raw: it.raw });
        }
      }

      // Wykonaj instrukcje inicjalizujące kolory TIA (COLUP0, COLUPF, COLUBK)
      for (var s = 0; s < compiledInstructions.length; s++) {
        var ci = compiledInstructions[s];
        if (ci.mnem === 'LDA' && ci.arg.indexOf('#') === 0) cpu.A = ci.val & 0xFF;
        if (ci.mnem === 'STA') RAM[ci.val & 0xFF] = cpu.A;
      }

      var dump = "ROM ($F000): ";
      for (var d = 0; d < 16; d++) dump += ROM[d].toString(16).toUpperCase().padStart(2, '0') + " ";
      dump += "\nSPRITES ($F100): ";
      for (var d2 = 0x100; d2 < 0x110; d2++) dump += ROM[d2].toString(16).toUpperCase().padStart(2, '0') + " ";
      document.getElementById('hexDumpBox').textContent = dump;
      document.getElementById('romBytesCount').textContent = total;
      return total;
    } catch (e) {
      return 0;
    }
  }

  function atariColorToHex(byteVal, fallbackHex) {
    if (byteVal === undefined || byteVal === 0) return fallbackHex;
    var hue = (byteVal >> 4) & 0x0F;
    var pal = [
      '#000000', '#fde047', '#f97316', '#ef4444',
      '#ec4899', '#a855f7', '#6366f1', '#3b82f6',
      '#0ea5e9', '#06b6d4', '#14b8a6', '#22c55e',
      '#65a30d', '#84cc16', '#eab308', '#d97706'
    ];
    return pal[hue] || fallbackHex;
  }

  function drawSpriteFromROM(ctx, romOffset, x, y, color) {
    ctx.fillStyle = color;
    for (var row = 0; row < 8; row++) {
      var b = ROM[(romOffset + row) & 0x0FFF];
      for (var bit = 0; bit < 8; bit++) {
        if (b & (1 << (7 - bit))) {
          ctx.fillRect((x + bit) | 0, (y + row) | 0, 1, 1);
        }
      }
    }
  }

  // 2. DŹWIĘK WEB AUDIO
  var audioCtx = null;
  var soundEnabled = true;

  function unlockAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }

  function playTone(freq, dur, type, vol) {
    if (!soundEnabled) return;
    unlockAudio();
    if (!audioCtx) return;
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq || 440, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.08));
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + (dur || 0.08));
    } catch (e) {}
  }

  // 3. STAN GIER I RENDEROWANIE
  var canvas = document.getElementById('tiaCanvas');
  var ctx = canvas.getContext('2d');
  var powerOn = true;
  var colorMode = true;
  var diffHard = false;
  var currentGame = 1;
  var gameVariant = 1;
  var turboActive = false;
  var frameCount = 0;
  var fireCooldown = 0;
  var input = { up: false, down: false, left: false, right: false, fire: false };

  var games = [
    { name: 'COMBAT (1977)', scoreP1: 0, scoreCPU: 0 },
    { name: 'SPACE INVADERS (6507 ROM)', scoreP1: 0, scoreCPU: 3 },
    { name: 'PITFALL! (1982)', scoreP1: 2000, scoreCPU: 3 },
    { name: 'SUPER BREAKOUT', scoreP1: 0, scoreCPU: 5 },
    { name: 'ADVENTURE (1980)', scoreP1: 0, scoreCPU: 1 }
  ];

  var invaders = { px: 76, aliens: [], shields: [], ufo: { x: -20, active: false }, dir: 1, stepTimer: 0, animFrame: 0, marchNote: 0, bullets: [], enemyBullets: [] };
  var combat = { p1: { x: 25, y: 96 }, cpu: { x: 135, y: 96 }, bullets: [] };
  var pitfall = { px: 24, py: 124, vy: 0, jumping: false, logs: [{ x: 125 }, { x: 195 }], goldX: 135 };
  var breakout = { px: 64, bx: 80, by: 115, bvx: 1.4, bvy: -1.6, bricks: [] };
  var adventure = { px: 80, py: 155, keyX: 30, keyY: 50, hasKey: false, chaliceX: 130, chaliceY: 35 };

  function updateScoreOSD() {
    var g = games[currentGame];
    var osd = document.getElementById('osdScore');
    if (currentGame === 1) osd.textContent = 'SCORE: ' + String(g.scoreP1).padStart(4, '0') + ' | ♥' + g.scoreCPU;
    else if (currentGame === 0) osd.textContent = 'P1: ' + g.scoreP1 + ' | CPU: ' + g.scoreCPU;
    else osd.textContent = 'SCORE: ' + g.scoreP1;
  }

  function initGame(idx) {
    currentGame = idx;
    var btns = document.querySelectorAll('.cart-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', i === idx);
    }
    document.getElementById('osdTitle').textContent = games[idx].name;

    invaders.px = 76;
    invaders.bullets = [];
    invaders.enemyBullets = [];
    invaders.aliens = [];
    invaders.dir = 1;
    invaders.ufo = { x: -20, active: false };

    for (var r = 0; r < 6; r++) {
      for (var c = 0; c < 6; c++) {
        invaders.aliens.push({ x: 18 + c * 18, y: 28 + r * 12, row: r, alive: true });
      }
    }
    invaders.shields = [
      { x: 32, y: 146, hp: 8 },
      { x: 74, y: 146, hp: 8 },
      { x: 116, y: 146, hp: 8 }
    ];

    combat.p1 = { x: 25, y: 96 }; combat.cpu = { x: 135, y: 96 }; combat.bullets = [];
    pitfall.px = 24; pitfall.py = 124; pitfall.vy = 0; pitfall.jumping = false;
    breakout.px = 64; breakout.bx = 80; breakout.by = 115; breakout.bricks = [];
    var cols = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
    for (var br = 0; br < 5; br++) {
      for (var bc = 0; bc < 10; bc++) {
        breakout.bricks.push({ x: 6 + bc * 15, y: 26 + br * 8, alive: true, color: cols[br] });
      }
    }
    adventure.px = 80; adventure.py = 155; adventure.hasKey = false;
    updateScoreOSD();
  }

  function col(hex, gray) { return colorMode ? hex : (gray || '#a8a29e'); }

  function updateAndRender() {
    frameCount++;
    if (!powerOn) {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, 160, 192);
      requestAnimationFrame(updateAndRender);
      return;
    }

    var speedMult = diffHard ? 1.35 : 1.0;
    var firing = input.fire || (turboActive && frameCount % 8 === 0);
    if (fireCooldown > 0) fireCooldown--;

    // ================== GRA 1: SPACE INVADERS (Z ROM $F100) ==================
    if (currentGame === 1) {
      ctx.fillStyle = atariColorToHex(RAM[0x09], '#000000');
      ctx.fillRect(0, 0, 160, 192);

      var playerColor = col(atariColorToHex(RAM[0x06], '#65a30d'), '#ffffff');
      var shieldColor = col(atariColorToHex(RAM[0x08], '#ea580c'), '#a3a3a3');

      ctx.fillStyle = playerColor;
      ctx.fillRect(0, 180, 160, 12);

      if (input.left) invaders.px = Math.max(8, invaders.px - 1.6);
      if (input.right) invaders.px = Math.min(144, invaders.px + 1.6);

      if (firing && fireCooldown === 0 && invaders.bullets.length < 2) {
        invaders.bullets.push({ x: invaders.px + 4, y: 166 });
        fireCooldown = 18;
        playTone(760, 0.06, 'square');
      }

      if (!invaders.ufo.active && frameCount % 320 === 0) {
        invaders.ufo.active = true;
        invaders.ufo.x = -12;
      }
      if (invaders.ufo.active) {
        invaders.ufo.x += 0.85;
        drawSpriteFromROM(ctx, 0x0160, invaders.ufo.x, 15, col('#f43f5e', '#ffffff'));
        if (invaders.ufo.x > 165) invaders.ufo.active = false;
      }

      var aliveAliens = [];
      for (var aIdx = 0; aIdx < invaders.aliens.length; aIdx++) {
        if (invaders.aliens[aIdx].alive) aliveAliens.push(invaders.aliens[aIdx]);
      }
      if (aliveAliens.length === 0) initGame(1);

      var stepInterval = Math.max(4, Math.floor(aliveAliens.length * 0.75));
      invaders.stepTimer++;
      if (invaders.stepTimer >= stepInterval) {
        invaders.stepTimer = 0;
        invaders.animFrame = 1 - invaders.animFrame;
        var bass = [98, 87, 82, 73];
        playTone(bass[invaders.marchNote % 4], 0.05, 'sawtooth', 0.07);
        invaders.marchNote++;

        var hitEdge = false;
        for (var m = 0; m < aliveAliens.length; m++) {
          aliveAliens[m].x += invaders.dir * 3;
          if (aliveAliens[m].x > 144 || aliveAliens[m].x < 8) hitEdge = true;
        }
        if (hitEdge) {
          invaders.dir = -invaders.dir;
          for (var m2 = 0; m2 < aliveAliens.length; m2++) {
            aliveAliens[m2].y += 5;
            if (aliveAliens[m2].y >= 162) initGame(1);
          }
        }
      }

      if (frameCount % 55 === 0 && aliveAliens.length > 0) {
        var shooter = aliveAliens[Math.floor(Math.random() * aliveAliens.length)];
        invaders.enemyBullets.push({ x: shooter.x + 4, y: shooter.y + 8 });
      }

      var rowColors = ['#f43f5e', '#fb923c', '#eab308', '#4ade80', '#38bdf8', '#c084fc'];
      var baseRomOffset = invaders.animFrame === 0 ? 0x0100 : 0x0130;

      for (var dIdx = 0; dIdx < aliveAliens.length; dIdx++) {
        if (gameVariant === 2 && frameCount % 40 < 20) continue;
        var al = aliveAliens[dIdx];
        drawSpriteFromROM(ctx, baseRomOffset + (al.row % 6) * 8, al.x, al.y, col(rowColors[al.row % 6], '#d4d4d4'));
      }

      for (var sIdx = 0; sIdx < invaders.shields.length; sIdx++) {
        var sh = invaders.shields[sIdx];
        if (sh.hp <= 0) continue;
        ctx.fillStyle = shieldColor;
        ctx.fillRect(sh.x, sh.y, 14, 4);
        ctx.fillRect(sh.x, sh.y + 4, 4, 6);
        ctx.fillRect(sh.x + 10, sh.y + 4, 4, 6);
      }

      drawSpriteFromROM(ctx, 0x0168, invaders.px, 169, playerColor);

      ctx.fillStyle = '#fde047';
      for (var bi = invaders.bullets.length - 1; bi >= 0; bi--) {
        var b = invaders.bullets[bi];
        b.y -= 3.6;
        ctx.fillRect(b.x, b.y, 2, 5);

        if (invaders.ufo.active && b.y < 22 && Math.abs(b.x - (invaders.ufo.x + 4)) < 6) {
          invaders.ufo.active = false;
          games[1].scoreP1 += 200;
          updateScoreOSD();
          playTone(880, 0.2, 'square');
          invaders.bullets.splice(bi, 1);
          continue;
        }

        var hitSh = false;
        for (var si = 0; si < invaders.shields.length; si++) {
          var sObj = invaders.shields[si];
          if (sObj.hp > 0 && b.x >= sObj.x && b.x <= sObj.x + 14 && b.y >= sObj.y && b.y <= sObj.y + 10) {
            sObj.hp--; hitSh = true;
          }
        }
        if (hitSh) { invaders.bullets.splice(bi, 1); continue; }

        for (var ai = 0; ai < invaders.aliens.length; ai++) {
          var target = invaders.aliens[ai];
          if (target.alive && b.x >= target.x && b.x <= target.x + 8 && b.y >= target.y && b.y <= target.y + 8) {
            target.alive = false;
            games[1].scoreP1 += (6 - target.row) * 10;
            updateScoreOSD();
            playTone(280, 0.1, 'sawtooth');
            invaders.bullets.splice(bi, 1);
            break;
          }
        }
        if (b && b.y < 0) invaders.bullets.splice(bi, 1);
      }

      ctx.fillStyle = '#ffffff';
      for (var ebi = invaders.enemyBullets.length - 1; ebi >= 0; ebi--) {
        var eb = invaders.enemyBullets[ebi];
        eb.y += 2.1 * speedMult;
        ctx.fillRect(eb.x, eb.y, 2, 5);
        for (var esi = 0; esi < invaders.shields.length; esi++) {
          var esh = invaders.shields[esi];
          if (esh.hp > 0 && eb.x >= esh.x && eb.x <= esh.x + 14 && eb.y >= esh.y && eb.y <= esh.y + 10) {
            esh.hp--; eb.y = 200;
          }
        }
        if (eb.x >= invaders.px && eb.x <= invaders.px + 8 && eb.y >= 168 && eb.y <= 176) {
          games[1].scoreCPU--;
          playTone(95, 0.25, 'sawtooth');
          if (games[1].scoreCPU <= 0) { games[1].scoreCPU = 3; games[1].scoreP1 = 0; initGame(1); }
          else updateScoreOSD();
          invaders.enemyBullets.splice(ebi, 1);
          continue;
        }
        if (eb.y > 180) invaders.enemyBullets.splice(ebi, 1);
      }
    }

    // ================== GRA 0: COMBAT ==================
    else if (currentGame === 0) {
      ctx.fillStyle = col('#7c2d12', '#262626'); ctx.fillRect(0, 0, 160, 192);
      ctx.fillStyle = col('#fbbf24', '#a3a3a3'); ctx.fillRect(76, 45, 8, 102);
      if (input.left) combat.p1.x = Math.max(8, combat.p1.x - 1.4);
      if (input.right) combat.p1.x = Math.min(144, combat.p1.x + 1.4);
      if (input.up) combat.p1.y = Math.max(18, combat.p1.y - 1.4);
      if (input.down) combat.p1.y = Math.min(174, combat.p1.y + 1.4);
      if (firing && fireCooldown === 0) {
        combat.bullets.push({ x: combat.p1.x + 8, y: combat.p1.y + 3, vx: 2.8, owner: 1 });
        fireCooldown = 18; playTone(220, 0.07, 'sawtooth');
      }
      if (combat.cpu.y < combat.p1.y) combat.cpu.y += 0.65;
      if (combat.cpu.y > combat.p1.y) combat.cpu.y -= 0.65;
      if (frameCount % 55 === 0) combat.bullets.push({ x: combat.cpu.x - 4, y: combat.cpu.y + 3, vx: -2.4, owner: 2 });
      ctx.fillStyle = col('#38bdf8', '#e5e5e5'); ctx.fillRect(combat.p1.x, combat.p1.y, 9, 9);
      ctx.fillStyle = col('#4ade80', '#737373'); ctx.fillRect(combat.cpu.x, combat.cpu.y, 9, 9);
      ctx.fillStyle = '#fff';
      for (var ci = combat.bullets.length - 1; ci >= 0; ci--) {
        var cb = combat.bullets[ci]; cb.x += cb.vx; ctx.fillRect(cb.x, cb.y, 3, 3);
        if (cb.owner === 1 && Math.abs(cb.x - combat.cpu.x) < 9 && Math.abs(cb.y - combat.cpu.y) < 9) {
          games[0].scoreP1++; updateScoreOSD(); playTone(110, 0.2, 'sawtooth'); combat.bullets.splice(ci, 1); continue;
        }
        if (cb.owner === 2 && Math.abs(cb.x - combat.p1.x) < 9 && Math.abs(cb.y - combat.p1.y) < 9) {
          games[0].scoreCPU++; updateScoreOSD(); playTone(90, 0.2, 'sawtooth'); combat.bullets.splice(ci, 1); continue;
        }
        if (cb.x < 0 || cb.x > 160) combat.bullets.splice(ci, 1);
      }
    }

    // ================== GRA 2: PITFALL ==================
    else if (currentGame === 2) {
      ctx.fillStyle = col('#14532d', '#262626'); ctx.fillRect(0, 0, 160, 136);
      ctx.fillStyle = col('#ca8a04', '#737373'); ctx.fillRect(0, 136, 160, 22);
      ctx.fillStyle = col('#451a03', '#171717'); ctx.fillRect(0, 158, 160, 34);
      if (input.left) pitfall.px = Math.max(8, pitfall.px - 1.5);
      if (input.right) pitfall.px = Math.min(146, pitfall.px + 1.5);
      if ((input.up || firing) && !pitfall.jumping) { pitfall.vy = -4.3; pitfall.jumping = true; playTone(480, 0.09); }
      pitfall.py += pitfall.vy;
      if (pitfall.py < 124) pitfall.vy += 0.25; else { pitfall.py = 124; pitfall.vy = 0; pitfall.jumping = false; }
      ctx.fillStyle = col('#92400e', '#a3a3a3');
      for (var li = 0; li < pitfall.logs.length; li++) {
        pitfall.logs[li].x -= 1.4; if (pitfall.logs[li].x < -10) pitfall.logs[li].x = 165;
        ctx.fillRect(pitfall.logs[li].x, 129, 8, 7);
      }
      ctx.fillStyle = col('#fde047', '#ffffff'); ctx.fillRect(pitfall.goldX, 126, 7, 6);
      if (Math.abs(pitfall.px - pitfall.goldX) < 9 && pitfall.py > 118) {
        games[2].scoreP1 += 500; pitfall.goldX = 20 + Math.random() * 120; updateScoreOSD(); playTone(880, 0.15);
      }
      ctx.fillStyle = col('#22c55e', '#ffffff'); ctx.fillRect(pitfall.px, pitfall.py, 7, 12);
    }

    // ================== GRA 3: BREAKOUT ==================
    else if (currentGame === 3) {
      ctx.fillStyle = '#09090b'; ctx.fillRect(0, 0, 160, 192);
      if (input.left) breakout.px = Math.max(4, breakout.px - 2.4);
      if (input.right) breakout.px = Math.min(130, breakout.px + 2.4);
      ctx.fillStyle = col('#38bdf8', '#ffffff'); ctx.fillRect(breakout.px, 174, 26, 5);
      breakout.bx += breakout.bvx; breakout.by += breakout.bvy;
      if (breakout.bx < 4 || breakout.bx > 154) breakout.bvx = -breakout.bvx;
      if (breakout.by < 14) breakout.bvy = -breakout.bvy;
      if (breakout.by >= 170 && breakout.by <= 178 && breakout.bx >= breakout.px - 2 && breakout.bx <= breakout.px + 28) {
        breakout.bvy = -Math.abs(breakout.bvy); playTone(520, 0.05);
      }
      if (breakout.by > 190) { breakout.bx = 80; breakout.by = 110; breakout.bvy = -1.6; }
      for (var bri = 0; bri < breakout.bricks.length; bri++) {
        var br = breakout.bricks[bri];
        if (!br.alive) continue;
        ctx.fillStyle = col(br.color, '#d4d4d4'); ctx.fillRect(br.x, br.y, 13, 6);
        if (breakout.bx >= br.x && breakout.bx <= br.x + 13 && breakout.by >= br.y && breakout.by <= br.y + 6) {
          br.alive = false; breakout.bvy = -breakout.bvy; games[3].scoreP1 += 10; updateScoreOSD(); playTone(660, 0.05);
        }
      }
      ctx.fillStyle = '#fff'; ctx.fillRect(breakout.bx, breakout.by, 4, 4);
    }

    // ================== GRA 4: ADVENTURE ==================
    else if (currentGame === 4) {
      ctx.fillStyle = col('#3f3f46', '#262626'); ctx.fillRect(0, 0, 160, 192);
      if (input.left) adventure.px = Math.max(20, adventure.px - 1.6);
      if (input.right) adventure.px = Math.min(134, adventure.px + 1.6);
      if (input.up) adventure.py = Math.max(26, adventure.py - 1.6);
      if (input.down) adventure.py = Math.min(176, adventure.py + 1.6);
      if (!adventure.hasKey) {
        ctx.fillStyle = '#fde047'; ctx.fillRect(adventure.keyX, adventure.keyY, 8, 4);
        if (Math.abs(adventure.px - adventure.keyX) < 9 && Math.abs(adventure.py - adventure.keyY) < 9) {
          adventure.hasKey = true; playTone(740, 0.12);
        }
      } else {
        ctx.fillStyle = '#f43f5e'; ctx.fillRect(adventure.chaliceX, adventure.chaliceY, 9, 11);
        if (Math.abs(adventure.px - adventure.chaliceX) < 10 && Math.abs(adventure.py - adventure.chaliceY) < 10) {
          games[4].scoreP1++; adventure.hasKey = false; adventure.px = 80; adventure.py = 160; updateScoreOSD(); playTone(920, 0.25);
        }
      }
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(adventure.px, adventure.py, 7, 7);
    }

    // Aktualizacja paska procesora 6507
    if (frameCount % 8 === 0 && compiledInstructions.length > 0) {
      instCursor = (instCursor + 1) % compiledInstructions.length;
      var cur = compiledInstructions[instCursor];
      document.getElementById('regPC').textContent = '$' + cur.pc.toString(16).toUpperCase();
      document.getElementById('regA').textContent = '$' + cpu.A.toString(16).toUpperCase().padStart(2, '0');
      document.getElementById('asmLiveLine').textContent =
        '[$' + cur.pc.toString(16).toUpperCase() + '] OP:$' + cur.op.toString(16).toUpperCase().padStart(2, '0') + ' -> ' + cur.raw;
    }

    requestAnimationFrame(updateAndRender);
  }

  // 4. START KOMPILATORA I PĘTLI GRY
  var asmInput = document.getElementById('asmInput');
  asmInput.value = DEFAULT_ASM;
  assemble6507(DEFAULT_ASM);
  initGame(1);
  requestAnimationFrame(updateAndRender);

  // 5. OBSŁUGA PRZYCISKÓW I DOTYKU
  var asmModal = document.getElementById('asmModal');
  document.getElementById('asmBtn').addEventListener('click', function() { asmModal.classList.toggle('show'); });
  document.getElementById('closeAsmBtn').addEventListener('click', function() { asmModal.classList.remove('show'); });

  document.getElementById('compileAsmBtn').addEventListener('click', function() {
    var bCount = assemble6507(asmInput.value);
    document.getElementById('asmStatus').textContent = 'Skompilowano ' + bCount + ' B do ROM!';
    playTone(880, 0.12, 'square');
  });

  document.getElementById('fetchGithubBtn').addEventListener('click', function() {
    var status = document.getElementById('asmStatus');
    status.textContent = 'Pobieranie z GitHub...';
    fetch('https://raw.githubusercontent.com/Julio-Rats/Space_Invaders_Atari_2600/main/Space%20Invaders.asm')
      .then(function(r) { return r.text(); })
      .then(function(txt) {
        asmInput.value = txt.slice(0, 3500) + '\n\n' + DEFAULT_ASM;
        var bCount = assemble6507(asmInput.value);
        status.textContent = 'Pobrano z GitHub (' + bCount + ' B)!';
      })
      .catch(function() {
        status.textContent = 'Użyto wbudowanego ROM ASM';
      });
  });

  var joyZone = document.getElementById('joyZone');
  var joyStick = document.getElementById('joyStick');
  var joyTouchId = null;

  function moveJoy(cx, cy) {
    var rect = joyZone.getBoundingClientRect();
    var dx = cx - (rect.left + rect.width / 2);
    var dy = cy - (rect.top + rect.height / 2);
    var maxR = 34;
    var dist = Math.hypot(dx, dy);
    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    joyStick.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
    input.left = dx < -10; input.right = dx > 10; input.up = dy < -10; input.down = dy > 10;
  }

  function resetJoy() {
    joyTouchId = null;
    joyStick.style.transform = 'translate(0px, 0px)';
    input.left = input.right = input.up = input.down = false;
  }

  joyZone.addEventListener('touchstart', function(e) {
    e.preventDefault(); unlockAudio();
    var t = e.changedTouches[0]; joyTouchId = t.identifier;
    moveJoy(t.clientX, t.clientY);
  }, { passive: false });

  joyZone.addEventListener('touchmove', function(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        moveJoy(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
    }
  }, { passive: false });

  joyZone.addEventListener('touchend', resetJoy);
  joyZone.addEventListener('touchcancel', resetJoy);

  var fireBtn = document.getElementById('fireBtn');
  fireBtn.addEventListener('touchstart', function(e) {
    e.preventDefault(); unlockAudio(); input.fire = true; fireBtn.classList.add('pressed');
  }, { passive: false });
  fireBtn.addEventListener('touchend', function(e) {
    e.preventDefault(); input.fire = false; fireBtn.classList.remove('pressed');
  });

  document.getElementById('turboBtn').addEventListener('click', function(e) {
    unlockAudio(); turboActive = !turboActive;
    e.currentTarget.classList.toggle('active', turboActive);
  });

  var cartBtns = document.querySelectorAll('.cart-btn');
  for (var cIdx = 0; cIdx < cartBtns.length; cIdx++) {
    cartBtns[cIdx].addEventListener('click', function() {
      unlockAudio();
      initGame(parseInt(this.getAttribute('data-game'), 10));
    });
  }

  document.getElementById('swPower').addEventListener('click', function() {
    powerOn = !powerOn;
    this.classList.toggle('power-on', powerOn);
    this.textContent = powerOn ? 'PWR: WŁ' : 'PWR: WYŁ';
  });
  document.getElementById('swSelect').addEventListener('click', function() {
    gameVariant = (gameVariant % 3) + 1;
    initGame(currentGame);
  });
  document.getElementById('swReset').addEventListener('click', function() {
    games[currentGame].scoreP1 = 0;
    initGame(currentGame);
  });
  document.getElementById('swColor').addEventListener('click', function() {
    colorMode = !colorMode;
    this.textContent = colorMode ? 'KOLOR' : 'CZ-B';
  });
  document.getElementById('swDiff').addEventListener('click', function() {
    diffHard = !diffHard;
    this.textContent = diffHard ? 'DIFF: A' : 'DIFF: B';
  });
})();
</script>
</body>
</html>
